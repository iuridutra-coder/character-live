  <style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.overlay{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden}.aura{position:absolute;width:65vw;height:55vw;max-width:520px;max-height:440px;border-radius:50%;background:radial-gradient(ellipse,#21b8bd3b 0%,#21b8bd00 70%);filter:blur(18px);transition:background .5s}.fish-wrap{position:relative;width:min(78vw,440px);height:min(84vh,620px);display:flex;align-items:center;justify-content:center;perspective:1200px;transform-style:preserve-3d;filter:drop-shadow(0 18px 28px #0008)}.fish-wrap img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px #0005);animation:floatFish 7.8s ease-in-out infinite}.character-canvas{width:100%;height:100%;display:block}.fish-wrap [hidden]{display:none!important}.reaction{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);padding:9px 15px;border:1px solid #83e7e188;border-radius:999px;background:#071c2bc9;color:#f2ffff;font-size:clamp(10px,2.5vw,14px);font-weight:900;letter-spacing:.1em;white-space:nowrap;text-shadow:0 1px 4px #000}.overlay.special .aura{background:radial-gradient(ellipse,#c3f36b66 0%,#21b8bd00 70%)}
@keyframes floatFish{0%,100%{transform:translate3d(0,2px,0) rotateY(-2deg) rotateZ(-.4deg)}50%{transform:translate3d(0,-7px,0) rotateY(2deg) rotateZ(.5deg)}}@keyframes slowDance{0%,100%{transform:translate3d(0,0,0) rotateZ(0) rotateY(0)}25%{transform:translate3d(-7px,-5px,0) rotateZ(-3deg) rotateY(-4deg)}50%{transform:translate3d(0,-9px,0) rotateZ(0) rotateY(3deg)}75%{transform:translate3d(7px,-4px,0) rotateZ(3deg) rotateY(-2deg)}}@keyframes gentleHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(-3px)}}
.fish-wrap[data-reaction="dance"] img{animation:floatFish 7.8s ease-in-out infinite,slowDance 7.2s ease-in-out 1}.fish-wrap[data-reaction="happy"] img{animation:floatFish 7.8s ease-in-out infinite,gentleHop 3.4s ease-in-out 1}.fish-wrap[data-reaction="love"] img{animation:floatFish 7.8s ease-in-out infinite,slowDance 4s ease-in-out 1}.fish-wrap[data-reaction="spin"] img{animation:floatFish 7.8s ease-in-out infinite,slowDance 4.4s ease-in-out 1}.fish-wrap[data-reaction="special"] img{animation:floatFish 7.8s ease-in-out infinite,slowDance 6.8s ease-in-out 1}@media(prefers-reduced-motion:reduce){.fish-wrap img{animation:none!important}.aura{transition:none}}
.pair-panel{position:fixed;z-index:20;left:50%;bottom:max(3vh,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,380px);padding:14px 16px;border:1px solid #75e5e0a8;border-radius:16px;background:#071b2bf2;color:#f4ffff;box-shadow:0 12px 36px #0009;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;pointer-events:auto}.pair-panel[hidden]{display:none!important}.pair-panel strong{display:block;font-size:12px;letter-spacing:.12em}.pair-panel p{margin:7px 0 10px;color:#c4e5e9;font-size:12px;line-height:1.4}.pair-panel form{display:flex;gap:8px}.pair-panel input{min-width:0;flex:1;padding:11px 12px;border:1px solid #5d9ba5;border-radius:9px;background:#102e40;color:white;font-size:14px;outline:none}.pair-panel input:focus{border-color:#a6f4df;box-shadow:0 0 0 2px #7fe8cf33}.pair-panel button{padding:0 15px;border:0;border-radius:9px;background:#a5e9d3;color:#082331;font-weight:900;font-size:13px}.pair-panel button:disabled{opacity:.55}.pair-panel small{display:block;margin-top:8px;color:#a8c7ce;font-size:10px;line-height:1.35}.pair-panel[data-error="true"] small{color:#ffb7a9}

</style>

<style>

/* CHARACTER LIVE V8 - ANIMACOES */

#fishWrap[data-reaction="dance"] #fishSprite {

  animation: v8Rose 3.2s ease-in-out infinite !important;

}

#fishWrap[data-reaction="happy"] #fishSprite {

  animation: v8TikTok 1.1s ease-in-out infinite !important;

}

#fishWrap[data-reaction="love"] #fishSprite {

  animation: v8Heart 1.8s ease-in-out infinite !important;

}

#fishWrap[data-reaction="spin"] #fishSprite {

  animation: v8Perfume 2.4s ease-in-out infinite !important;

}

#fishWrap[data-reaction="special"] #fishSprite {

  animation: v8Galaxy 2.8s ease-in-out infinite !important;

}

@keyframes v8Rose {

  0%,100% { transform: translate(0,0) rotate(0); }

  25% { transform: translate(-6vw,-5vh) rotate(-12deg); }

  50% { transform: translate(5vw,-8vh) rotate(10deg) scale(1.12); }

  75% { transform: translate(3vw,2vh) rotate(-6deg); }

}

@keyframes v8TikTok {

  0%,100% { transform: translateY(0) scale(1); }

  35% { transform: translateY(-11vh) scale(1.12,.9); }

  55% { transform: translateY(0) scale(.92,1.12); }

  75% { transform: translateY(-4vh); }

}

@keyframes v8Heart {

  0%,100% { transform: translateY(0) scale(1); }

  30% { transform: translateY(-5vh) scale(1.16); }

  60% { transform: translateY(1vh) scale(.96); }

}

@keyframes v8Perfume {

  0% { transform: translate(0,0) rotate(0); }

  25% { transform: translate(6vw,-4vh) rotate(15deg); }

  50% { transform: translate(0,-8vh) rotate(0) scale(1.12); }

  75% { transform: translate(-6vw,-4vh) rotate(-15deg); }

  100% { transform: translate(0,0) rotate(0); }

}

@keyframes v8Galaxy {

  0% { transform: translate(0,0) rotate(0); }

  25% { transform: translate(8vw,-7vh) rotate(18deg) scale(1.12); }

  50% { transform: translate(-5vw,-11vh) rotate(-15deg) scale(1.18); }

  75% { transform: translate(-8vw,2vh) rotate(12deg); }

  100% { transform: translate(0,0) rotate(0); }

}

<style>
/* CHARACTER LIVE V8 - EFEITOS */
.cl-v8-effects {
  position: fixed;
  inset: 0;
  z-index: 99999;
  overflow: hidden;
  pointer-events: none;
}

.cl-v8-particle {
  position: absolute;
  font-size: 34px;
  animation: v8Particle 2.8s ease-out forwards;
  filter: drop-shadow(0 2px 5px #0005);
}

@keyframes v8Particle {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(.4);
  }
  15% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translateY(-65vh) scale(1.3) rotate(220deg);
  }
}
</style>

<script>
(function () {
  if (window.characterLiveV8Loaded) return;
  window.characterLiveV8Loaded = true;

  const effects = document.createElement('div');
  effects.className = 'cl-v8-effects';
  document.querySelector('.overlay').appendChild(effects);

  const gifts = {
    'rosa': ['🌹','🌸','🌷','🌺'],
    'tiktok': ['🎵','✨','💫','🎶'],
    'coração': ['💗','💖','💕','❤️'],
    'coracao': ['💗','💖','💕','❤️'],
    'perfume': ['🫧','✨','💎'],
    'galaxy': ['🌟','✨','💫','⭐']
  };

  window.addEventListener('character-live:gift', function (event) {
    const data = event.detail || {};
    const name = String(
      data.giftName || data.gift_name || data.name || ''
    ).toLocaleLowerCase('pt-BR');

    const particles = gifts[name] || ['✨','🎁','💫'];

    for (let i = 0; i < 12; i++) {
      const particle = document.createElement('span');
      particle.className = 'cl-v8-particle';
      particle.textContent = particles[i % particles.length];
      particle.style.left = (5 + Math.random() * 90) + '%';
      particle.style.top = (55 + Math.random() * 40) + '%';
      particle.style.animationDelay = (Math.random() * 0.7) + 's';

      effects.appendChild(particle);
      setTimeout(() => particle.remove(), 3800);
    }
  });
})();
</script>
</style>

    if(reconnectTimer!==null||!relayUrl)return;
    reconnectAttempt+=1;
    const ceiling=Math.min(15000,1000*Math.pow(2,Math.min(reconnectAttempt-1,4)));
    const delay=Math.round(ceiling*(0.8+Math.random()*0.4));
    banner.textContent=`RECONEXÃO EM ${Math.ceil(delay/1000)}s`;
    reconnectTimer=window.setTimeout(()=>{reconnectTimer=null;connectRelay();},delay);
  }
  if(pairForm)pairForm.addEventListener('submit',event=>{event.preventDefault();pairNow();});
  if(wsParam&&relayUrl){
    if(!apiBase){setPairVisible(false);}
    else if(getSession())connectRelay();
    else{setPairVisible(true);pairMessage('O código temporário é exibido no terminal do servidor.');banner.textContent='PAREAMENTO NECESSÁRIO';}
  }else setPairVisible(false);
})();

</script>

      detail: {
        giftName: nome,
        coins: moedas,
        repeatCount: quantidade,

  painel.querySelectorAll('button[data-nome]').forEach(botao => {
